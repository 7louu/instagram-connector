[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-connector"
version = "0.1.0"
description = "A connector for Instagram to fetch posts such as images, comments and texts."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.25.1",
    "pymongo",
    "pydantic-settings"
]

[project.scripts]
instagram-connector = "connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
